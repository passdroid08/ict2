server:
  port: 8080

spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: USER03
    password: USER03

  jpa:
    hibernate:
      ddl-auto: update   # 개발: update / 운영: validate 또는 none 권장
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.OracleDialect
    open-in-view: false  # 컨트롤러에서 지연로딩 터지는 문제 예방(서비스에서 해결하는 습관)

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터까지 보고 싶을 때(시끄러우면 주석)
